<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heartless Case v6</title>
<style>
/* v6 «سين سيتي»: الصورة أبيض وأسود والأحمر بس للبدلة والدم والكلام
   الوحدة = ٠٫١ مم · الكانفاس ٧٩٫٥×١٦٥٫٢ مم بالنزيف · فتحة الكاميرا x ٩٢–٣٢٣ / y ٨٩–٤٩١ */
@font-face { font-family: Bodoni; src: url(../fonts/BodoniModa-400.ttf); }
@font-face { font-family: FiraX; src: url(../fonts/FiraSansXCond-700.ttf); font-weight: 700; }
@font-face { font-family: FiraC; src: url(../fonts/FiraSansCond-300.ttf); font-weight: 300; }
@font-face { font-family: FiraC; src: url(../fonts/FiraSansCond-400.ttf); font-weight: 400; }
@font-face { font-family: Script; src: url(../fonts/MrsSaintDelafield.ttf); }

:root { --coal: #070304; --blood: #c0141c; --hot: #e3221e; --ink: #f1ece8; --mute: #a99a97; }
html, body { margin: 0; background: #000; }
#canvas { position: relative; width: 795px; height: 1652px; overflow: hidden; background: var(--coal); }

.portrait { position: absolute; left: -32px; top: 296px; width: 860px; }

/* فوق يمين جنب الكاميرا */
.mast { position: absolute; right: 64px; top: 104px; text-align: right; }
.mast b { display: block; font: 700 52px/1 FiraX; letter-spacing: 9px; margin-right: -9px; color: var(--ink); }
.mast i { display: block; margin-top: 12px; font: 400 38px/1 Bodoni; font-style: normal; letter-spacing: 6px; margin-right: -6px; color: var(--blood); }
.mast s { display: block; margin: 22px 0 0 auto; width: 70px; height: 3px; background: var(--blood); text-decoration: none; }

/* خطوط ضوء أحمر زي أنوار فيجاس وهي بتجري */
.streak { position: absolute; left: -40px; right: -40px; height: 4px; filter: blur(3px); mix-blend-mode: screen;
  background: linear-gradient(90deg, transparent, rgba(227,34,30,.75) 30%, rgba(255,120,100,.9) 52%, rgba(227,34,30,.6) 70%, transparent); }

/* السطر الوحيد من Heartless */
.lyric { position: absolute; left: 0; right: 0; top: 1246px; text-align: center; }
.lyric small { display: block; font: 400 25px/1 FiraC; letter-spacing: 8px; margin-right: -8px; color: var(--ink); }
.lyric em { display: block; margin-top: -6px; font: 400 150px/1.05 Script; font-style: normal; color: var(--hot);
  text-shadow: 0 0 26px rgba(227,34,30,.45); }
/* والسطر التاني من Until I Bleed Out */
.sign { position: absolute; left: 0; right: 0; top: 1508px; text-align: center;
  font: 300 20px/1 FiraC; letter-spacing: 7px; margin-right: -7px; color: var(--mute); }

.dust { position: absolute; inset: 0; width: 795px; height: 1652px; opacity: .45; mix-blend-mode: screen; pointer-events: none;
  -webkit-mask-image: radial-gradient(230px 300px at 399px 766px, transparent 70%, #000 100%); }
.grain { position: absolute; inset: 0; opacity: .24; mix-blend-mode: overlay; pointer-events: none; }
.vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 46%, transparent 55%, rgba(0,0,0,.6)); }

body.guide #canvas::before { content: ""; position: absolute; inset: 30px; border: 2px dashed #3cf; border-radius: 90px; z-index: 9; }
body.guide #canvas::after { content: ""; position: absolute; left: 92px; top: 89px; width: 231px; height: 402px; border-radius: 34px;
  border: 2px dashed #3cf; background: rgba(51,204,255,.18); z-index: 9; }
</style>
</head>
<body>
<div id="canvas">
  <img class="portrait" src="portrait.png" alt="">

  <div class="mast"><b>THE WEEKND</b><i>AFTER HOURS</i><s></s></div>

  <div class="streak" style="top:1362px"></div>
  <div class="streak" style="top:1388px; height:2px; opacity:.6; left:120px"></div>
  <div class="streak" style="top:1416px; height:6px; opacity:.45; right:180px"></div>

  <div class="lyric">
    <small>ALL THIS MONEY AND THIS PAIN</small>
    <em>got me heartless</em>
  </div>
  <div class="sign">just want it out of my life</div>

  <img class="dust" src="dust.png" alt="">
  <div class="vignette"></div>
  <svg class="grain" width="795" height="1652">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
</div>
</body>
</html>
