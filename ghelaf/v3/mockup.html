<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Case Mockup</title>
<style>
/* موكاب ريلمي GT ماستر إديشن — الوحدة ٠٫١ مم برضه. مكان الكاميرا تقريبي */
:root { --bg1: #5a0a0c; --bg2: #120203; }
html, body { margin: 0; }
#scene { position: relative; width: 1400px; height: 2100px; overflow: hidden;
  background: radial-gradient(70% 55% at 50% 42%, var(--bg1), #2a0406 55%, var(--bg2)); }

.phone { position: absolute; left: 332px; top: 254px; width: 735px; height: 1592px; border-radius: 92px;
  background: #151213;
  box-shadow: 30px 50px 60px rgba(0,0,0,.55), 70px 120px 160px rgba(0,0,0,.5), 0 0 0 2px rgba(196,30,22,.25),
              inset 0 0 0 3px #2a2426, inset 0 0 0 9px #0d0b0c; }
.print { position: absolute; inset: 12px; border-radius: 82px; overflow: hidden; }
/* ملف الطباعة فيه ٣ مم نزيف — نقصه هنا */
.print img { position: absolute; left: -30px; top: -30px; width: 795px; height: 1652px; }
.gloss { position: absolute; inset: 12px; border-radius: 82px; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.16), transparent 28%, transparent 70%, rgba(255,255,255,.06)); }

/* جزيرة الكاميرا وفتحة الجراب حواليها */
.cut { position: absolute; left: 62px; top: 62px; width: 262px; height: 368px; border-radius: 54px;
  background: #0b0a0a; box-shadow: 0 0 0 5px #1d191a, inset 0 2px 6px rgba(255,255,255,.08); }
.island { position: absolute; inset: 14px; border-radius: 44px;
  background: linear-gradient(160deg, #2b2729, #121011); box-shadow: inset 0 0 0 2px #3a3436; }
.lens { position: absolute; border-radius: 50%;
  background: radial-gradient(circle at 38% 35%, #4d5a6e 0 6%, #0e1218 14%, #05070a 45%, #1c2026 62%, #000 70%);
  box-shadow: 0 0 0 7px #232022, 0 0 0 10px #4a4447, 0 6px 10px rgba(0,0,0,.6); }
.l-a { left: 32px; top: 30px; width: 128px; height: 128px; }
.l-b { left: 32px; top: 182px; width: 128px; height: 128px; }
.l-c { left: 176px; top: 46px; width: 50px; height: 50px; }
.flash { position: absolute; left: 182px; top: 128px; width: 38px; height: 38px; border-radius: 50%;
  background: radial-gradient(circle, #fff6d8, #e7c977 55%, #8a7234); box-shadow: 0 0 0 4px #2a2627; }

.code { position: absolute; left: 0; right: 0; top: 1910px; text-align: center;
  font: italic 900 34px/1 'Inter', sans-serif; letter-spacing: 6px; color: #b3221a; }
</style>
</head>
<body>
<div id="scene">
  <div class="phone">
    <div class="print"><img src="cover_print.png" alt=""></div>
    <div class="gloss"></div>
    <div class="cut"><div class="island">
      <div class="lens l-a"></div><div class="lens l-b"></div><div class="lens l-c"></div><div class="flash"></div>
    </div></div>
  </div>
  <div class="code">REALME GT MASTER EDITION</div>
</div>
</body>
</html>
