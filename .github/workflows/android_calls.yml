name: Android Calls Build

on:
  push:
    paths:
      - 'android_calls/**'
      - '.github/workflows/android_calls.yml'
  workflow_dispatch:

permissions:
  contents: read   # البناء بيقرا الكود بس، مالوش يكتب في الريبو

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_calls

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.6'

      - name: Verify Signing Secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::ضيف secrets التوقيع (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) في إعدادات الريبو."
            exit 1
          fi

      - name: Decode Keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > keystore.jks

      - name: Run Unit Tests
        run: |
          gradle testReleaseUnitTest

      - name: Assemble Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android_calls/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease
          if ls app/build/outputs/apk/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "::error::الـAPK طلع من غير توقيع"; exit 1
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calls-bridge-apk
          path: android_calls/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

